name: building-website-local

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env.dev
        required: true
      - path: ./backend/.env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The image's venv is in /opt/venv, outside this mount, so a rebuilt image always brings its own
      # packages. The host's backend/.venv shows up as /app/.venv but nothing in the container uses it.
      - ./backend:/app
    # --reload-dir: watch the app's code only. /app also shows the host's backend/.venv (its symlinks point
    # outside the container), tests and migrations, none of which should restart the server (P0-07).
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir app
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - local_net

  db:
    # Bump together with the CI service in .github/workflows/ci.yml. A new major can't open an older
    # major's data directory, so a major bump also gets a new volume name (README "Database upgrades").
    image: postgres:18
    environment:
      POSTGRES_DB: condo_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432" # DB_PORT: see Makefile
    volumes:
      # Postgres 18+ images keep the data in a versioned subdirectory (/var/lib/postgresql/18/docker), so
      # the volume is mounted one level up.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d condo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - local_net

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - local_net

  # S3 emulator (ADR-0007 "Local emulator"). State is in memory: the init script recreates the bucket on
  # every start, and uploaded files are gone after `make down`.
  s3:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ca-central-1
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ./docker/s3-init/create-bucket.sh:/etc/localstack/init/ready.d/create-bucket.sh:ro
    healthcheck:
      # Healthy only after the init script has run without an error. LocalStack reports "completed" even
      # when a script fails, so a script in state ERROR must fail the check too.
      test:
        - CMD-SHELL
        - >-
          r=$$(curl -fsS http://localhost:4566/_localstack/init/ready)
          && echo "$$r" | grep -q '"completed": true'
          && ! echo "$$r" | grep -q '"state": "ERROR"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - local_net

volumes:
  postgres18_data:

networks:
  local_net:
    driver: bridge
