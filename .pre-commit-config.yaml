# Install once per clone: `cd backend && uv run pre-commit install` (the hook runs from the repo root).
# CI runs ruff directly (.github/workflows/ci.yml); these hooks catch the same problems before a commit.
# The merged baseline migration is never edited (CLAUDE.md rule 11), so every hook skips it.
# The whitespace and end-of-file hooks cover backend/ and frontend/ (frontend/ added in P0-03c).
exclude: ^backend/migrations/versions/989e5bd83064_initial_empty_database_baseline\.py$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep in step with ruff in backend/uv.lock
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^(backend/|frontend/|\.pre-commit-config\.yaml$)
      - id: trailing-whitespace
        files: ^(backend/|frontend/|\.pre-commit-config\.yaml$)
      - id: check-merge-conflict
      - id: detect-private-key
