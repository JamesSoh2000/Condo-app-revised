[project]
name = "condo-management-api"
version = "0.1.0"
description = "FastAPI backend for the condo management app."
readme = "../README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn",
    # The asyncio extra brings greenlet, which SQLAlchemy 2.1 no longer installs by default.
    "SQLAlchemy[asyncio]>=2.1.0,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "typer>=0.27.3",
    "argon2-cffi>=25.1.0",
    # S3 presigning, HEAD and ranged reads for uploads (ADR-0007, P3-04a).
    "boto3>=1.40",
    # app.files.storage runs boto3 in anyio's worker threads (it was only a transitive dependency).
    "anyio>=4.0.0",
]

[dependency-groups]
dev = [
    # Types for boto3's S3 client, so mypy strict checks app.files.storage.
    "boto3-stubs[s3]>=1.40",
    "httpx>=0.28.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=8.0.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
# Merged migrations are never edited (CLAUDE.md rule 11), so the pre-ruff baseline is excluded by name.
# New migrations are linted and format-checked.
extend-exclude = ["migrations/versions/989e5bd83064_initial_empty_database_baseline.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["migrations.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
