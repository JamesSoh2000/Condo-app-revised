[project]
name = "condo-management-api"
version = "0.1.0"
description = "FastAPI backend for the condo management app."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.7.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn",
    "SQLAlchemy>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    "uuid6>=2025.0.1",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]
