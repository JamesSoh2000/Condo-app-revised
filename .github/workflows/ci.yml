name: Baseline CI Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04

    # Real Postgres, the same major as docker-compose.yml (Dependabot doesn't update this block; bump both
    # together). The test suite creates condo_test itself.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: condo_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d condo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      # Migrations and `alembic check` run against this database; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@localhost:5432/condo_dev
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:devpassword@localhost:5432/condo_test

    defaults:
      run:
        working-directory: backend

    steps:
      # Downloads the repository onto the GitHub-hosted runner.
      # Without this step, the runner has no project files to test.
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs the same Python version pinned by the project.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      # Installs uv and enables uv's dependency cache.
      # The cache uses backend/pyproject.toml and backend/uv.lock so dependency
      # installs are faster when the backend dependency graph has not changed.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      # Installs backend dependencies into the fresh CI runner.
      # CI cannot use your local .venv, so this must happen every run.
      - name: Install backend dependencies
        run: uv sync --locked

      # Lint: unused imports, import order, bugbear, bandit security checks and more
      # (rule sets in backend/pyproject.toml). Fails the job before tests run.
      - name: Ruff lint
        run: uv run ruff check .

      # Formatting: fails if any file would be reformatted. Fix locally with `uv run ruff format .`.
      - name: Ruff format check
        run: uv run ruff format --check .

      # Static types, strict for app/.
      - name: Mypy
        run: uv run mypy app

      # Exactly one migration head. Runs before `upgrade`, which would otherwise fail first with
      # "Multiple head revisions" and hide the real problem.
      - name: Single migration head
        run: |
          uv run alembic heads
          test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Fails when the models and the migrations disagree (a model change without a migration).
      - name: Alembic check (model/migration drift)
        run: uv run alembic check

      # Runs the backend test suite.
      # uv run ensures pytest runs from the uv-managed backend environment.
      - name: Run backend tests
        run: uv run pytest

  frontend-checks:
    name: Frontend lint, types, ratchet and build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Downloads the repository onto the GitHub-hosted runner.
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs the same Node.js version pinned by the project.
      # The npm cache uses frontend/package-lock.json as the dependency key.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs frontend dependencies exactly from package-lock.json.
      # npm ci is preferred in CI because it is repeatable and fails if the
      # lockfile and package.json are out of sync.
      - name: Install frontend dependencies
        run: npm ci

      # Lint, blocking (the 68-error baseline was fixed in P0-03a). Includes the ADR-0011 rule that bans
      # Base44 imports under src/features and src/app.
      - name: Lint
        run: npm run lint

      # Self-test of the Base44 import fence: lint passes vacuously while src/features and src/app are empty.
      - name: ESLint fence self-test
        run: bash ../scripts/check-eslint-fence.sh

      # Type check (tsconfig.json: strict, allowJs, checkJs off, so only .ts/.tsx are checked).
      - name: Type check
        run: npm run typecheck

      # Vitest: the API client, the query client's retry policy, and component tests.
      - name: Unit tests
        run: npm run test

      # OpenAPI drift: the committed src/api/schema.d.ts must be what the backend's current OpenAPI
      # generates. A backend change without `make gen-api` fails here. The export needs Python and the
      # backend's dependencies, but no database or server.
      - name: Set up Python (OpenAPI export)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Set up uv (OpenAPI export)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Generated API types are up to date
        run: |
          (cd ../backend && uv sync --locked)
          (cd ../backend && uv run python -m app.export_openapi) > ../openapi.json
          npm run gen:api
          # status, not diff: a deleted-then-regenerated (untracked) file must fail too.
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            git diff -- src/api/schema.d.ts
            echo "::error file=frontend/src/api/schema.d.ts::Stale API types: run \`make gen-api\` and commit the result."
            exit 1
          fi

      # Base44 ratchet: fails if Base44 references under frontend/src go up (ADR-0011).
      - name: Base44 ratchet
        run: bash ../scripts/base44-count.sh

      # Proves the frontend still produces a production Vite build.
      - name: Build frontend
        run: npm run build

  docs:
    name: Docs links and explanation references
    runs-on: ubuntu-24.04

    steps:
      # Full history so the explanation check can diff this branch against the base branch.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      # The Python and Postgres pins agree across .python-version, the Dockerfile, pyproject, compose and
      # this file (Dependabot updates some of them and not others).
      - name: Check version pins
        run: python3 scripts/check-version-pins.py

      # Every relative markdown link (outside docs/archive/) must resolve, including #anchors.
      - name: Check markdown links
        run: python3 scripts/check-links.py

      # Only explanation files added or changed by this branch are checked; older ones are snapshots.
      - name: Check explanation code references
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python3 scripts/check-explanation-refs.py
