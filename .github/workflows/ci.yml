name: Baseline CI Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-24.04

    # Real Postgres, the same major as docker-compose.yml (Dependabot doesn't update this block; bump both
    # together). Each test run creates and drops its own database, named after TEST_DATABASE_URL's.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: condo_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d condo_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # The S3 emulator, the same image as docker-compose.yml's `s3` (ADR-0007). The files tests create a
      # versioned bucket of their own per run (backend/tests/files/conftest.py), so no init script runs here.
      s3:
        image: localstack/localstack:4.14.0
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: ca-central-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      # Migrations and `alembic check` run against this database; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql+asyncpg://postgres:devpassword@localhost:5432/condo_dev
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:devpassword@localhost:5432/condo_test
      # The emulator above, read only by backend/tests/files/conftest.py. It accepts any credentials, so
      # these are not secrets.
      TEST_S3_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

    defaults:
      run:
        working-directory: backend

    steps:
      # Downloads the repository onto the GitHub-hosted runner.
      # Without this step, the runner has no project files to test.
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs the same Python version pinned by the project.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      # Installs uv and enables uv's dependency cache.
      # The cache uses backend/pyproject.toml and backend/uv.lock so dependency
      # installs are faster when the backend dependency graph has not changed.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      # Installs backend dependencies into the fresh CI runner.
      # CI cannot use your local .venv, so this must happen every run.
      - name: Install backend dependencies
        run: uv sync --locked

      # Lint: unused imports, import order, bugbear, bandit security checks and more
      # (rule sets in backend/pyproject.toml). Fails the job before tests run.
      - name: Ruff lint
        run: uv run ruff check .

      # Formatting: fails if any file would be reformatted. Fix locally with `uv run ruff format .`.
      - name: Ruff format check
        run: uv run ruff format --check .

      # Static types, strict for app/; tests/ too, with untyped defs allowed (pyproject's overrides).
      - name: Mypy
        run: uv run mypy app tests

      # Exactly one migration head. Runs before `upgrade`, which would otherwise fail first with
      # "Multiple head revisions" and hide the real problem.
      - name: Single migration head
        run: |
          uv run alembic heads
          test "$(uv run alembic heads | wc -l)" -eq 1

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Fails when the models and the migrations disagree (a model change without a migration).
      - name: Alembic check (model/migration drift)
        run: uv run alembic check

      # Runs the backend test suite.
      # uv run ensures pytest runs from the uv-managed backend environment.
      - name: Run backend tests
        run: uv run pytest

  frontend-checks:
    name: Frontend lint, types, ratchet and build
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Downloads the repository onto the GitHub-hosted runner.
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs the same Node.js version pinned by the project.
      # The npm cache uses frontend/package-lock.json as the dependency key.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installs frontend dependencies exactly from package-lock.json.
      # npm ci is preferred in CI because it is repeatable and fails if the
      # lockfile and package.json are out of sync.
      - name: Install frontend dependencies
        run: npm ci

      # Lint, blocking (the 68-error baseline was fixed in P0-03a). Includes the ADR-0011 rule that bans
      # Base44 imports under src/features and src/app.
      - name: Lint
        run: npm run lint

      # Self-test of the Base44 import fence: lint passes vacuously while src/features and src/app are empty.
      - name: ESLint fence self-test
        run: bash ../scripts/check-eslint-fence.sh

      # Type check (tsconfig.json: strict, allowJs, checkJs off, so only .ts/.tsx are checked).
      - name: Type check
        run: npm run typecheck

      # Vitest: the API client, the query client's retry policy, and component tests.
      - name: Unit tests
        run: npm run test

      # OpenAPI drift: the committed src/api/schema.d.ts must be what the backend's current OpenAPI
      # generates. A backend change without `make gen-api` fails here. The export needs Python and the
      # backend's dependencies, but no database or server.
      - name: Set up Python (OpenAPI export)
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      - name: Set up uv (OpenAPI export)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.11.17"
          enable-cache: true
          cache-dependency-glob: |
            backend/pyproject.toml
            backend/uv.lock

      - name: Generated API types are up to date
        run: |
          (cd ../backend && uv sync --locked)
          (cd ../backend && uv run python -m app.export_openapi) > ../openapi.json
          npm run gen:api
          # status, not diff: a deleted-then-regenerated (untracked) file must fail too.
          if [ -n "$(git status --porcelain -- src/api/schema.d.ts)" ]; then
            git diff -- src/api/schema.d.ts
            echo "::error file=frontend/src/api/schema.d.ts::Stale API types: run \`make gen-api\` and commit the result."
            exit 1
          fi

      # Base44 ratchet: fails if Base44 references under frontend/src go up (ADR-0011).
      - name: Base44 ratchet
        run: bash ../scripts/base44-count.sh

      # Proves the frontend still produces a production Vite build.
      - name: Build frontend
        run: npm run build

  docs:
    name: Docs links and explanation references
    runs-on: ubuntu-24.04

    steps:
      # Full history so the explanation check can diff this branch against the base branch.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.8"

      # The Python and Postgres pins agree across .python-version, the Dockerfile, pyproject, compose and
      # this file (Dependabot updates some of them and not others).
      - name: Check version pins
        run: python3 scripts/check-version-pins.py

      # Every relative markdown link (outside docs/archive/) must resolve, including #anchors.
      - name: Check markdown links
        run: python3 scripts/check-links.py

      # Only explanation files added or changed by this branch are checked; older ones are snapshots.
      - name: Check explanation code references
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: python3 scripts/check-explanation-refs.py

      # The ticket-loop helpers (WF-01) against a fake gh serving captured GitHub responses, and a temporary
      # git origin: each helper is shown to fail closed, not only to pass.
      - name: Ticket-loop helpers self-test
        run: bash scripts/check-ticket-helpers.sh

  prodlike:
    name: Prod-like stack smoke
    runs-on: ubuntu-24.04

    # The artifacts staging will run (P1-08, ADR-0013): the API image tagged with this commit and the built
    # SPA, behind deploy/Caddyfile. `make prodlike` is the same build, migrate and start as locally; the
    # image is never pushed.
    env:
      GIT_SHA: ${{ github.sha }}
      API_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Shellcheck the smoke scripts
        run: shellcheck scripts/smoke.sh scripts/prodlike-checks.sh scripts/ticket-preflight.sh scripts/pr-wait.sh scripts/pr-state.sh scripts/check-ticket-helpers.sh scripts/fixtures/ticket-helpers/fake-gh

      - name: Validate the Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=:8080 -e API_UPSTREAM=api:8000 \
            -e S3_PUBLIC_ORIGIN=http://localhost:4566 \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$(docker compose -f compose.prodlike.yml config --images | grep '^caddy:')" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Installs the frontend dependencies, builds the image and the SPA, runs `alembic upgrade head` from the image on an empty database,
      # then starts the stack and waits until every service is healthy.
      - name: Build, migrate and start the prod-like stack
        run: make prodlike

      # The SHA comes from GitHub, not from the Makefile: the running image must be this commit.
      - name: Smoke test
        run: bash scripts/smoke.sh http://localhost:8080 "$GITHUB_SHA"

      - name: Prod-like wiring checks (ports, mounts, workers, forwarded headers)
        run: bash scripts/prodlike-checks.sh http://localhost:8080

      - name: Stack logs
        if: failure()
        run: docker compose -f compose.prodlike.yml logs --no-color --tail=200

  e2e:
    name: E2E journeys
    runs-on: ubuntu-24.04

    # Playwright journeys (P4-09, e2e/README.md) against the prod-like stack: the image and built SPA this commit
    # produces, behind Caddy on :8080, with the worker and Mailpit. `make e2e` builds and starts it, resets the
    # database, installs the suite and Chromium, and runs both projects; CI=true gives each test one retry.
    env:
      GIT_SHA: ${{ github.sha }}
      API_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # Types and the no-sleep rule (criterion 5) fail fast, before the stack is built.
      - name: Suite typecheck and lint
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run lint

      - name: Build the prod-like stack and run the journeys
        run: make e2e E2E_STACK=prodlike

      # Traces (first retry), videos and screenshots (failures) and the HTML report that opens them.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14

      - name: Stack logs
        if: failure()
        run: docker compose -f compose.prodlike.yml logs --no-color --tail=200
